# Publishes the game to GitHub Pages on every push to main.
# dist/ is the site root. The build-stamp check and the quick regression suites run first (the three traces among them);
# nothing is published if any of them fails. Build 37: the slow suites (tests/suite-groups.json) no longer hold a publish
# up: they run in full.yml after every push, weekly and on request, and every suite is run locally before a commit.
name: Publish to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # some suites compare against earlier builds with `git show`
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build stamp is current
        run: node tools/stamp-build.mjs --check
      - name: Quick regression suites and the three traces
        run: node tools/run-suites.mjs quick --jobs 4

  deploy:
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
